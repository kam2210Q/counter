<!DOCTYPE html>
<html lang="en">
<head>
    <title>Counter App</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 400px;
            height: 400px;
            border: 2px solid palevioletred;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
            margin-top: 100px;
            background-color: lightgrey;
            transition: background-color 0.3s ease;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 15px;
            margin: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        #increase {
            background-color: greenyellow;
        }

        #decrease {
            background-color: orangered;
        }

        #reset {
            background-color: beige;
        }

        #count {
            font-size: 30px;
            font-weight: 900;
            margin: 20px;
            padding: 15px 30px;
            border: 3px solid black;   
            border-radius: 10px;       
            transition: all 0.3s ease; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Counter App</h1>
        <p id="count">0</p>

        <div>
            <button id="increase">Increase</button>
            <button id="decrease">Decrease</button>
            <button id="reset">Reset</button>
        </div>
    </div>

    <script>
        let countDisplay = document.getElementById("count");
        let container = document.querySelector(".container");
        let count = 0;

        document.getElementById("increase").addEventListener("click", function(){
            count++;
            updateUI();
        });

        document.getElementById("decrease").addEventListener("click", function(){
            count--;
            updateUI();
        });

        document.getElementById("reset").addEventListener("click", function(){
            count = 0;
            updateUI();
        });

        function updateUI(){
            countDisplay.innerText = count;

            if(count < 0){
                countDisplay.style.color = "orangered";
                countDisplay.style.borderColor = "orangered";
                container.style.backgroundColor = "mistyrose";
            } 
            else if(count > 0){
                countDisplay.style.color = "greenyellow";
                countDisplay.style.borderColor = "greenyellow";
                container.style.backgroundColor = "lightgreen";
            } 
            else{
                countDisplay.style.color = "grey";
                countDisplay.style.borderColor = "black";
                container.style.backgroundColor = "lightgrey";
            }
        }
    </script>

</body>
</html>
